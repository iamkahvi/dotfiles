onboarding = false
# Herdr configuration
# Keyboard docs: https://herdr.dev/docs/keyboard/

[keys]
prefix = "ctrl+a"
toggle_sidebar = "prefix+backslash"
previous_tab = "prefix+["
next_tab = "prefix+]"
copy_mode = "prefix+shift+["
new_tab = "prefix+t"
new_workspace = "prefix+n"
previous_workspace = "prefix+k"
next_workspace = "prefix+j"

[ui]
show_agent_labels_on_pane_borders = false

# Toggle a pi session side panel (kahvi.pi-panel plugin)
agent_panel_sort = "priority"
[[keys.command]]
key = "prefix+p"
type = "plugin_action"
command = "kahvi.pi-panel.toggle"
description = "toggle pi side panel"

[ui.toast]
delivery = "terminal"
