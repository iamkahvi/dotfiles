id = "kahvi.todo"
name = "TODO"
version = "0.1.0"
min_herdr_version = "0.8.0"
description = "Open the current project's TODO file in a Vim tab"
platforms = ["macos", "linux"]

[[actions]]
id = "open"
title = "Open TODO tab"
contexts = ["workspace"]
command = ["python3", "todo.py"]

[[panes]]
id = "todo"
title = "TODO"
placement = "tab"
command = ["sh", "-c", "exec vim -- \"$HERDR_TODO_FILE\""]
