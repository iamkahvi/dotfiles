# copy-file-contents plugin uses ya.clipboard(): pbcopy on macOS, wl-copy/xclip on Linux,
# so one binding works on both machines. Plugin pinned in package.toml; run `ya pkg install` on a new machine.
[[mgr.prepend_keymap]]
on = "<C-y>"
run = "plugin copy-file-contents"
desc = "Copy file contents"

[[mgr.prepend_keymap]]
on = [ "c", "y" ]
run = "plugin copy-file-contents"
desc = "Copy file contents"

[[mgr.prepend_keymap]]
on = [ "e", "c" ]
run = 'shell --block -- code --wait "$@"'
desc = "Edit with VS Code"

[[mgr.prepend_keymap]]
on = [ "e", "p" ]
run = 'shell --block -- pumice "$@"'
desc = "Edit with Pumice"
